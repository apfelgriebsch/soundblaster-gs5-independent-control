name: Create release from VERSION

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soundblaster-gs5-independent-control-release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+){0,2}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must contain a valid version such as 1.2." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "archive=soundblaster-gs5-independent-control-v$version.zip" >> "$GITHUB_OUTPUT"

      - name: Check whether the release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release ZIP
        if: steps.existing_release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import shutil
          import tempfile
          from pathlib import Path

          source = Path(os.environ["GITHUB_WORKSPACE"])
          version = os.environ["VERSION"]
          archive = source / os.environ["ARCHIVE"]
          root_name = f"soundblaster-gs5-independent-control-v{version}"

          with tempfile.TemporaryDirectory() as temporary_directory:
              temporary = Path(temporary_directory)
              staged_root = temporary / root_name
              shutil.copytree(
                  source,
                  staged_root,
                  ignore=shutil.ignore_patterns(
                      ".git",
                      ".github",
                      "__pycache__",
                      "*.pyc",
                      "soundblaster-gs5-independent-control-v*.zip",
                      "*.sha256",
                  ),
              )
              shutil.make_archive(
                  str(archive.with_suffix("")),
                  "zip",
                  root_dir=temporary,
                  base_dir=root_name,
              )

          print(f"Created {archive.name}")
          PY

      - name: Create GitHub release
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" "$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sound Blaster GS5 Independent Control v$VERSION" \
            --generate-notes
